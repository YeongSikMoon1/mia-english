const M4={

 fromTRS(o,t,q,s){const[x,y,z,w]=q,x2=x+x,y2=y+y,z2=z+z,xx=x*x2,xy=x*y2,xz=x*z2,yy=y*y2,yz=y*z2,zz=z*z2,wx=w*x2,wy=w*y2,wz=w*z2;
  o[0]=(1-(yy+zz))*s[0];o[1]=(xy+wz)*s[0];o[2]=(xz-wy)*s[0];o[3]=0;
  o[4]=(xy-wz)*s[1];o[5]=(1-(xx+zz))*s[1];o[6]=(yz+wx)*s[1];o[7]=0;
  o[8]=(xz+wy)*s[2];o[9]=(yz-wx)*s[2];o[10]=(1-(xx+yy))*s[2];o[11]=0;

 lookAt(e,c,u){let zx=e[0]-c[0],zy=e[1]-c[1],zz=e[2]-c[2],l=Math.hypot(zx,zy,zz);zx/=l;zy/=l;zz/=l;
  let xx=u[1]*zz-u[2]*zy,xy=u[2]*zx-u[0]*zz,xz=u[0]*zy-u[1]*zx;l=Math.hypot(xx,xy,xz);xx/=l;xy/=l;xz/=l;

const Q={

 const N=J.nodes,nn=N.length,parent=new Int32Array(nn).fill(-1);

  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,b);gl.generateMipmap(gl.TEXTURE_2D);

   outW:mt.outlineWidthMode==='worldCoordinates'?(mt.outlineWidthFactor||0):0,outC:mt.outlineColorFactor||[0,0,0],outTex:texOf(mt.outlineWidthMultiplyTexture)}});
 /* 메시/프리미티브 */
 const prims=[];
 N.forEach((n,ni)=>{if(n.mesh==null)return;const mesh=J.meshes[n.mesh];
  mesh.primitives.forEach((p,pi)=>{const A=p.attributes,pos=acc(A.POSITION),nor=acc(A.NORMAL),uv=acc(A.TEXCOORD_0),jn=acc(A.JOINTS_0),wt=acc(A.WEIGHTS_0),idx=acc(p.indices);

   if(p.targets)pr.targets=p.targets.map(t=>acc(t.POSITION).data);
   const vao=gl.createVertexArray();gl.bindVertexArray(vao);
   const mk=(data,loc,size,type,isInt)=>{const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);gl.enableVertexAttribArray(loc);
    isInt?gl.vertexAttribIPointer(loc,size,type,0,0):gl.vertexAttribPointer(loc,size,type,false,0,0);return b};
   pr.posBuf=mk(pos.data,0,3,gl.FLOAT);pr.norBuf=mk(nor.data,1,3,gl.FLOAT);mk(uv.data,2,2,gl.FLOAT);
   mk(jn.ct===5121?jn.data:new Uint16Array(jn.data),3,4,jn.ct===5121?gl.UNSIGNED_BYTE:gl.UNSIGNED_SHORT,true);mk(wt.data,4,4,gl.FLOAT);
   const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx.data,gl.STATIC_DRAW);

 /* 스킨 */
 const skins=J.skins.map(s=>{const ibm=acc(s.inverseBindMatrices).data,jt=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,jt);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,4,s.joints.length,0,gl.RGBA,gl.FLOAT,null);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  return{joints:s.joints,ibm,tex:jt,buf:new Float32Array(s.joints.length*16)}});
 /* 표정 */
 const expr={};for(const k in vrm.expressions.preset)expr[k]={binds:vrm.expressions.preset[k].morphTargetBinds||[],w:0,tw:0};
 const exprNodes={};
 let morphDirty=true;
 function applyMorph(){if(!morphDirty)return;morphDirty=false;
  for(const pr of prims){if(!pr.targets)continue;const w=new Float32Array(pr.targets.length);let any=false;
   for(const k in expr){const e=expr[k];if(e.w<.001)continue;for(const b of e.binds){if(b.node===pr.node){w[b.index]+=b.weight*e.w;any=true}}}
   pr.pos.set(pr.basePos);if(any)for(let t=0;t<w.length;t++){if(w[t]<.001)continue;const tg=pr.targets[t],ww=w[t];for(let i=0;i<pr.pos.length;i++)pr.pos[i]+=tg[i]*ww}
   gl.bindBuffer(gl.ARRAY_BUFFER,pr.posBuf);gl.bufferSubData(gl.ARRAY_BUFFER,0,pr.pos)}}
 /* 눈 키우기: 눈 관련 프리미티브(흰자·눈동자·하이라이트·아이라인·속눈썹)를 눈 중심 기준으로 XY 확대. 모프 변화량도 같은 비율로 키워 깜빡임이 어긋나지 않게 한다. */
 function scaleEyes(sc){
  const ey=prims.filter(p=>/Eye(White|Iris|Highlight|line|lash)/i.test(p.mat.name||''));const wh=ey.find(p=>/EyeWhite/i.test(p.mat.name||''));if(!wh)return;
  if(!scaleEyes.done){scaleEyes.done=ey.map(p=>({p,base:p.basePos.slice(),tg:(p.targets||[]).map(t=>t.slice())}))}
  const cs=[0,0,0,0,0,0];{const b=scaleEyes.done.find(o=>o.p===wh).base;let n=[0,0];for(let i=0;i<wh.count;i++){const k=b[3*i]>0?0:1;cs[k*3]+=b[3*i];cs[k*3+1]+=b[3*i+1];cs[k*3+2]+=b[3*i+2];n[k]++}for(let k=0;k<2;k++)for(let j=0;j<3;j++)cs[k*3+j]/=Math.max(1,n[k])}

 /* 스프링본 */
 const colG=(sbExt.colliderGroups||[]).map(g=>g.colliders.map(ci=>sbExt.colliders[ci]));
 const springs=(sbExt.springs||[]).map(sp=>{const js=sp.joints.map(j=>({node:j.node,hit:j.hitRadius||0,stiff:j.stiffness??1,gp:j.gravityPower||0,gd:j.gravityDir||[0,-1,0],drag:j.dragForce??.4}));

 /* 셰이더 */
 const VS=`#version 300 es

/* ---- 아바타 컨트롤러: 자연스러운 상시 모션 + 제스처 + 립싱크 ---- */
const D2R=Math.PI/180;
class Avatar{
 constructor(m){this.m=m;this.t=0;this.speaking=false;this.env=0;this.listening=false;this.lis=0;this.pulse=0;
  this.blink=0;this.nextBlink=2;this.bs=-1;this.gx=0;this.gy=0;this.tgx=0;this.tgy=0;this.nextSac=1.2;
  this.vow={aa:0,ih:0,ou:0,ee:0,oh:0};this.cur='aa';this.ph=0;this.lastS=1;this.mood={happy:.18,relaxed:0,surprised:0,sad:0,angry:0};this.tmood={happy:.18,relaxed:0,surprised:0,sad:0,angry:0};this.post={hx:0,hz:0,sp:0,sh:0,bounce:0,laugh:0};this.tpost={hx:0,hz:0,sp:0,sh:0,bounce:0,laugh:0};this.em=null;this.gz=null;
  this.g=null;this.nod=null;this.beat=null;this.nextBeat=3;this.smQ={};this.sway=0}

 setMood(o){this.tmood=Object.assign({happy:0,relaxed:0,surprised:0,sad:0,angry:0},o)}
 /* 감정 연기: 표정 + 몸짓(고개 기울임·숙임·들썩임) + 시선. dur초 뒤 평상시로 천천히 돌아온다. */
 emote(name,dur=3.2){const E={
   neutral:[{happy:.18},{}],
   joy:[{happy:.6},{hz:3,hx:-1,sp:-.8}],
   delight:[{happy:.95},{hz:5,hx:-2,sp:-1.4,bounce:1.2,laugh:.2}],
   laugh:[{happy:1},{hz:4,hx:-3,sp:-1,laugh:1}],
   sorry:[{sad:.5,relaxed:.1},{hx:8,sp:3,hz:-3}],
   worried:[{sad:.55,surprised:.12},{hx:3,hz:-6,sp:1}],
   surprise:[{surprised:1},{hx:-6,sp:-2.5}],
   panic:[{surprised:.8,sad:.45},{hx:-3,hz:4,sp:-1}],
   confused:[{surprised:.28,sad:.3},{hz:7,hx:-1}],
   thinking:[{relaxed:.25,happy:.05},{hz:-5,hx:-2}],
   cheeky:[{happy:.75,angry:.14},{hz:6,hx:1.5}],
   shy:[{relaxed:.45,happy:.4},{hx:4,hz:5}],
   proud:[{happy:.75},{hx:-4,sp:-2}],
   pout:[{angry:.35,sad:.2},{hx:3,hz:-3}]}[name]||[{happy:.18},{}];
  this.setMood(E[0]);this.tpost=Object.assign({hx:0,hz:0,sp:0,sh:0,bounce:0,laugh:0},E[1]);
  if(name==='thinking')this.gz={x:-7,y:-4};else if(name==='confused')this.gz={x:6,y:-3};else if(name==='shy'||name==='sorry')this.gz={x:5,y:5};else this.gz=null;

 env_(g){if(!g)return 0;const s=this.t-g.t0;if(s<0||s>g.dur)return 0;return Math.min(1,s/.4)*Math.min(1,(g.dur-s)/.5)}

  for(const k in this.post)this.post[k]+=(this.tpost[k]-this.post[k])*(1-Math.exp(-5*dt));

  let hy=3.5*Math.sin(t*.31)+1.5*Math.sin(t*.83+2)+e*2*Math.sin(t*1.3);

  this.nextSac-=dt;if(this.nextSac<0){this.nextSac=1.3+Math.random()*2.8;const c=Math.random()<.6;this.tgx=c?0:(Math.random()*2-1)*4;this.tgy=c?0:(Math.random()*2-1)*2.5}
  const gtx=this.gz?this.gz.x:this.tgx,gty=this.gz?this.gz.y:this.tgy;this.gx=sm(this.gx,gtx-hy*.3,16);this.gy=sm(this.gy,gty-hx*.3,16);

  this.nextBlink-=dt;if(this.bs<0&&this.nextBlink<0){this.bs=0;this.dbl=Math.random()<.2}
  if(this.bs>=0){this.bs+=dt;const T=.2,x=this.bs/T;this.blink=x<.4?Math.sin(x/.4*Math.PI/2):x<1?Math.cos((x-.4)/.6*Math.PI/2):0;if(this.bs>=T){this.bs=-1;this.blink=0;this.nextBlink=this.dbl?.1:2.3+Math.random()*3.8}}
  /* ---- 팔(기본 자세) ---- */

  const arm=(s)=>{/* s=+1 왼쪽, -1 오른쪽 */const side=s>0?'left':'right';
   idle[side+'UpperArm']=Q.euler(0,s*-6*D2R,-s*(76+1.2*Math.sin(t*.8+s))*D2R);
   idle[side+'LowerArm']=Q.euler(0,s*-20*D2R+0,s*0);
   idle[side+'Hand']=Q.euler(0,0,-s*6*D2R);
   idle[side+'Shoulder']=Q.euler(0,0,s*(-1.2*br)*D2R)};
  arm(1);arm(-1);
  const fing=(side,s,curl,thumb)=>{for(const f of ['Index','Middle','Ring','Little']){const k=curl*(f==='Index'?.9:f==='Middle'?1:f==='Ring'?1.05:1.1);
    for(const j of['Proximal','Intermediate','Distal'])idle[side+f+j]=Q.axis('z',-s*k*(j==='Proximal'?.7:j==='Intermediate'?1:.6))}
   idle[side+'ThumbMetacarpal']=Q.euler(0,0,-s*thumb*.3);idle[side+'ThumbProximal']=Q.euler(0,0,-s*thumb*.5);idle[side+'ThumbDistal']=Q.euler(0,0,-s*thumb*.4)};
  fing('left',1,.35+.05*Math.sin(t*.7),.35);fing('right',-1,.35+.05*Math.sin(t*.7+1),.35);
  /* ---- 제스처 ---- */
  const pose={...idle};const ge=this.env_(this.g);
  if(ge>0){const s=t-this.g.t0,n=this.g.name;
   if(n==='wave'){const o=Math.sin(s*6.28*2.4);
    pose.leftUpperArm=Q.euler(0,-38*D2R,-(-12)*D2R*0+(-28*D2R)*-1*0-(-20)*D2R*0);
    pose.leftUpperArm=Q.mul(Q.axis('y',-35*D2R),Q.axis('z',-22*D2R));
    pose.leftLowerArm=Q.mul(Q.axis('z',(100+10*o)*D2R),Q.axis('x',-70*D2R));
    pose.leftHand=Q.axis('z',(8*o)*D2R);fing('left',1,.04,0);for(const k in idle)if(/^left(Index|Middle|Ring|Little|Thumb)/.test(k))pose[k]=idle[k]}
   if(n==='thumbs'){
    pose.leftUpperArm=Q.mul(Q.axis('y',-18*D2R),Q.axis('z',-34*D2R));
    pose.leftLowerArm=Q.mul(Q.axis('y',-68*D2R),Q.axis('x',-95*D2R));
    for(const f of['Index','Middle','Ring','Little'])for(const j of['Proximal','Intermediate','Distal'])pose['left'+f+j]=Q.axis('z',-(1.3)*(j==='Proximal'?.8:1));
    pose.leftThumbMetacarpal=Q.axis('z',.15);pose.leftThumbProximal=Q.axis('z',0);pose.leftThumbDistal=Q.axis('z',0);pose.leftHand=Q.axis('x',20*D2R)}
   if(n==='shrug'){pose.leftUpperArm=Q.mul(Q.axis('y',-14*D2R),Q.axis('z',-52*D2R));pose.rightUpperArm=Q.mul(Q.axis('y',14*D2R),Q.axis('z',52*D2R));pose.leftLowerArm=Q.mul(Q.axis('y',-70*D2R),Q.axis('x',-30*D2R));pose.rightLowerArm=Q.mul(Q.axis('y',70*D2R),Q.axis('x',30*D2R))}
  }
  /* 말할 때 자연스러운 손짓(비트 제스처) */
  if(e>.5&&ge<=0){this.nextBeat-=dt;if(!this.beat&&this.nextBeat<0){this.beat={t0:t,s:Math.random()<.5?1:-1,a:.6+Math.random()*.4};this.nextBeat=1.6+Math.random()*2.4}}
  if(this.beat){const s=t-this.beat.t0,T=.9;if(s>T)this.beat=null;else{const w=Math.sin(s/T*Math.PI),side=this.beat.s>0?'left':'right',k=this.beat.s,a=this.beat.a*w*e;
    pose[side+'UpperArm']=Q.mul(Q.axis('y',k*-26*D2R*a),Q.axis('z',-k*(76-26*a)*D2R));
    pose[side+'LowerArm']=Q.mul(Q.axis('y',k*-(20+55*a)*D2R),Q.axis('z',k*10*a*D2R*Math.sin(s*5)));
    pose[side+'Hand']=Q.axis('z',-k*(6-10*a)*D2R)}}
  /* 팔 포즈 부드럽게 보간(급변 방지) */
  for(const k in pose){const prev=this.smQ[k]||pose[k];this.smQ[k]=Q.slerp(prev,pose[k],1-Math.exp(-10*dt));d[k]=this.smQ[k]}
  /* ---- 표정 ---- */
  for(const k in this.mood)this.mood[k]=sm(this.mood[k],this.tmood[k]||0,7);
  const mv=this.mood;const idl=.05*Math.sin(t*.55)+.04*Math.sin(t*1.3+1);m.setExpr('happy',Math.max(0,Math.min(1,(mv.happy+.1*e+idl)*.85)));m.setExpr('relaxed',mv.relaxed*.8);m.setExpr('surprised',Math.min(1,mv.surprised+.07*pu));m.setExpr('sad',mv.sad);m.setExpr('angry',mv.angry);

}

/* WebView 안에서 Mia(3D)만 그리는 부트 코드. React Native와는 postMessage(JSON)로만 통신한다. */
const cv=document.getElementById('cv');let gl=null,model=null,av=null,speaking=false,pulseIv=null;
const AP={ey:1.38,ez:1.6,cy:1.34,fov:28};   // 대화 중 줌업(상반신) 카메라
const send=o=>{try{window.ReactNativeWebView?window.ReactNativeWebView.postMessage(JSON.stringify(o)):parent!==window&&parent.postMessage(o,'*')}catch(e){}};
function fit(){const dpr=Math.min(devicePixelRatio||1,2),r=cv.getBoundingClientRect();cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr)}
async function start(buf){
  gl=cv.getContext('webgl2',{alpha:true,antialias:true,premultipliedAlpha:false});if(!gl)throw new Error('WebGL2 미지원');
  fit();addEventListener('resize',fit);
  model=await loadVRM(gl,buf);av=new Avatar(model);window.av=av;model.scaleEyes(window.EYE_SCALE||1);
  let last=performance.now();
  (function loop(now){const dt=Math.min((now-last)/1000,.1);last=now;av.update(dt);model.applyPose();model.updateWorld();model.stepSprings(dt);
    gl.viewport(0,0,cv.width,cv.height);gl.clearColor(0,0,0,0);gl.clearDepth(1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    const t=av.t,asp=cv.width/cv.height;const V=M4.lookAt([.03*Math.sin(t*.4),AP.ey+.01*Math.sin(t*.3),AP.ez],[0,AP.cy,0],[0,1,0]);
    model.render(M4.mul(null,M4.persp(AP.fov*D2R,asp,.05,20),V));requestAnimationFrame(loop)})(last);
  send({type:'ready'});
}
window.loadMia=async b64=>{try{const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);await start(u.buffer)}catch(e){send({type:'error',message:String(e)})}};
/* 모델 로딩: 앱이 window.__VRM_URL__(로컬 파일 경로)을 미리 넣어 주거나, 개발 중에는 ?vrm=Mia.vrm */
const q=window.__VRM_URL__||new URLSearchParams(location.search).get('vrm');if(q)fetch(q).then(r=>r.arrayBuffer()).then(start).catch(e=>send({type:'error',message:String(e)}));
/* 말하는 동안 입 모양(립싱크) 펄스: TTS가 단어 경계 이벤트를 주지 않는 플랫폼에서도 동작하도록 타이머로 구동 */
function setSpeaking(on){speaking=!!on;if(av){av.speak(on);if(on)av.listen(false)}clearInterval(pulseIv);if(on)pulseIv=setInterval(()=>{if(av)av.pulse=1},430)}
const handlers={
  speak:m=>setSpeaking(m.on),
  pulse:()=>{if(av)av.pulse=1},
  listen:m=>av&&av.listen(!!m.on),
  mood:m=>av&&av.setMood(m.mood||{}),
  emote:m=>av&&av.emote(m.name,m.dur||3.2),
  gesture:m=>av&&av.gesture(m.name,m.dur||2.4),
  nod:m=>av&&av.doNod(m.n||1),
  shake:()=>av&&av.doShake(),
  camera:m=>Object.assign(AP,m.cam||{}),
};
function onMsg(e){let m=e.data;if(typeof m==='string'){try{m=JSON.parse(m)}catch(_){return}}if(m&&handlers[m.type])handlers[m.type](m)}
addEventListener('message',onMsg);document.addEventListener('message',onMsg);   // iOS / Android WebView 둘 다

</script></body></html>
